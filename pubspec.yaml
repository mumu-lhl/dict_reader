name: dict_reader
description: Reading dictionary files, supporting MDX/MDD, StarDict, and ZIM file formats. It can simplify your writing of dictionary software.
version: 1.6.1
repository: https://github.com/mumu-lhl/dict_reader

environment:
  sdk: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.8

dependencies:
  charset: ^2.0.1
  blockchain_utils: ">=3.4.0 <8.0.0"
  collection: ^1.19.1
  html_unescape: ^2.0.0
  unorm_dart: ^0.3.3
  archive: ^4.5.2
  crypto: ^3.0.8
